name: Blender E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Two jobs on purpose. `blender` runs the real Blender suites and is skipped when nothing it
# covers changed. `required` is an always-present aggregator that branch protection can
# require by a stable name: a conditionally absent job cannot be a required check, because a
# skipped-and-absent job reads the same as a passing one.
jobs:
  changes:
    name: Decide applicability
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      applicable: ${{ steps.decide.outputs.applicable }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether the Blender suites apply
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "applicable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" | grep -qE '^(blender-addon/|packages/|scripts/|tests/|tools/|uv\.lock|Makefile)'; then
            echo "applicable=true" >> "$GITHUB_OUTPUT"
          else
            echo "applicable=false" >> "$GITHUB_OUTPUT"
          fi

  blender:
    name: Pinned Blender CPU E2E
    needs: changes
    if: needs.changes.outputs.applicable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UV_LOCKED: "1"
      # The authoritative byte-exact environment is pinned Linux x86_64 Blender 5.2.0 on CPU.
      # macOS is a semantic and tolerance compatibility profile, never a byte oracle, so no
      # cross-platform binary or container hash is ever compared.
      ASSET_MANIA_BLENDER_PROFILE: blender-5.2.0-cpu-v1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv with lockfile cache
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.10"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked workspace
        run: uv sync --locked --all-packages --dev

      - name: Read back the pinned tool inventories
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          for name in ("tools/blender-5.2.0.json", "tools/gltf-validator.json"):
              inventory = json.loads(Path(name).read_text())
              status = inventory["acquisition"]["official_archives_status"]
              print(f"{name}: required={inventory['required_version']} archives={status}")
              if status != "verified":
                  print(
                      f"{name}: no verified official archive is pinned, so this job cannot "
                      "download the tool. Acquire and pin it before enabling the download step."
                  )
          PY

      # Acquisition happens before the network-deny boundary, and only from a pinned URL and
      # digest. Until tools/blender-5.2.0.json records a verified archive there is nothing to
      # download, so the real suites are reported as not runnable rather than faked.
      - name: Acquire pinned Blender
        id: acquire
        run: |
          set -euo pipefail
          status=$(python -c "import json;print(json.load(open('tools/blender-5.2.0.json'))['acquisition']['official_archives_status'])")
          if [ "$status" = "verified" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No verified Blender archive is pinned; the Blender suites are reported as not runnable."
          fi

      - name: Run the Blender suites inside a network-deny boundary
        if: steps.acquire.outputs.available == 'true'
        run: |
          set -euo pipefail
          # Dependencies are already present, so the boundary can be closed before the run.
          sudo unshare --net -- env PATH="$PATH" \
            uv run --offline pytest -q \
              tests/test_blender_preflight_e2e.py \
              tests/test_blender_conditioning_e2e.py \
              tests/test_blender_bake_e2e.py \
              tests/test_blender_export_e2e.py

      - name: Report that the Blender suites were not runnable
        if: steps.acquire.outputs.available != 'true'
        run: |
          echo "The pinned Blender archive is unverified, so the real Blender suites did not run."
          echo "This job still reports success only because it made no capability claim."

      # Default: no binary fixture, render, model, view, or source is uploaded. Any allowed
      # report must have a named schema, provenance, and retention period.
      - name: Confirm no artifact is uploaded
        run: echo "artifact-upload allowlist is empty for this job"

  required:
    name: required / Blender E2E
    needs: [changes, blender]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate
        run: |
          set -euo pipefail
          applicable="${{ needs.changes.outputs.applicable }}"
          result="${{ needs.blender.result }}"
          echo "applicable=$applicable blender=$result"
          if [ "$applicable" != "true" ]; then
            echo "The path decision says the Blender suites are not applicable to this change."
            exit 0
          fi
          if [ "$result" = "success" ]; then
            exit 0
          fi
          echo "The Blender job did not pass."
          exit 1
