# An optional, separately distributed adapter. The CLI wheel has no runtime dependency on
# it; the root development workspace installs it only to run its fake-transport tests.
[project]
name = "asset-mania-provider-openai"
version = "0.2.0"
description = "Optional approval-gated GPT Image adapter for Asset Mania"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "asset-mania-contracts",
  "asset-mania-pipeline",
]

[project.entry-points."asset_mania.providers"]
openai = "asset_mania_provider_openai.client:PROVIDER"

[tool.uv.sources]
asset-mania-contracts = { workspace = true }
asset-mania-pipeline = { workspace = true }

[tool.uv.build-backend]
module-name = "asset_mania_provider_openai"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"
