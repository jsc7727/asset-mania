[project]
name = "asset-mania-blender-client"
version = "0.1.0"
description = "Apache-side Blender discovery, private envelopes, sanitized launch, and response validation"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "asset-mania-contracts",
  "asset-mania-pipeline",
]

[tool.uv.sources]
asset-mania-contracts = { workspace = true }
asset-mania-pipeline = { workspace = true }

[tool.uv.build-backend]
module-name = "asset_mania_blender_client"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"
