[project]
name = "asset-mania-engine-dad3dheads"
version = "0.2.0"
description = "Optional research-only external DAD-3DHeads adapter for Asset Mania"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "asset-mania-pipeline",
]

[project.scripts]
asset-mania-dad3dheads-plugin = "asset_mania_engine_dad3dheads.plugin:main"

[tool.uv.sources]
asset-mania-pipeline = { workspace = true }

[tool.uv.build-backend]
module-name = "asset_mania_engine_dad3dheads"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"
