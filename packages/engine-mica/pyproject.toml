[project]
name = "asset-mania-engine-mica"
version = "0.2.0"
description = "Optional research-only external MICA adapter for Asset Mania"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = ["asset-mania-pipeline", "numpy>=1.26"]

[project.scripts]
asset-mania-mica-plugin = "asset_mania_engine_mica.plugin:main"

[tool.uv.sources]
asset-mania-pipeline = { workspace = true }

[tool.uv.build-backend]
module-name = "asset_mania_engine_mica"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"
