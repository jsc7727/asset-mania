[project]
name = "asset-mania-pipeline"
version = "0.2.0"
description = "Immutable stage storage, lineage, plans, and approvals for Asset Mania runs"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "asset-mania-contracts",
  "Pillow>=11.3,<13",
]

[tool.uv.sources]
asset-mania-contracts = { workspace = true }

[tool.uv.build-backend]
module-name = "asset_mania_pipeline"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"
