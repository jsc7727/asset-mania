[project]
name = "asset-mania-workspace"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "jsonschema>=4.25,<5",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["packages", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
